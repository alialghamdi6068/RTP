# VoidFlame RTP — Donut-inspired world selector and safe random teleport.
# Run /rtp reload after changing this file.

world: ""
allowed-worlds: []
disabled-worlds: []
world-settings: {}
world-areas: {}
minimum-radius: 100
maximum-radius: 5000
countdown-seconds: 5
cooldown-seconds: 30
maximum-attempts: 30
maximum-active-searches: 25
search-timeout-seconds: 20
load-chunks: false
avoid-water: true

# Player menu defaults: standard dimensions appear first, followed by other eligible loaded worlds.
# Supported sizes are 27 or 54 only; other values reset to 27 to preserve pagination slots.
# The player selector automatically paginates when more worlds are available than fit on one page.
menu:
  title: "&8&lRandom Teleport"
  size: 27
  filler: true
  close-slot: 22
  world-slots:
    world: 11
    world_nether: 13
    world_the_end: 15

# Optional per-world overrides. Omitted values inherit the global settings.
# Set enabled: false to hide a world from the player menu and block direct RTP.
# minimum-y / maximum-y constrain the surface Y coordinate accepted for teleport.
# world-settings:
#   world:
#     enabled: true
#     minimum-radius: 100
#     maximum-radius: 5000
#     minimum-y: -64
#     maximum-y: 320
#     countdown-seconds: 5
#     cooldown-seconds: 30
#     maximum-attempts: 30
#     search-timeout-seconds: 20
#
# Optional per-world area override; values are X/Z block coordinates.
# world-areas:
#   world:
#     min-x: -3000
#     max-x: 3000
#     min-z: -3000
#     max-z: 3000

messages:
  prefix: "&8[&5&lRTP&8] &r"
  no-permission: "&cYou don't have permission to use this command."
  usage: "&7Usage: &f/rtp &8[&fworld&8|&fgui&8|&fworlds&8|&freload&8]"
  players-only: "&cThis command can only be used by a player."
  admin-gui-players-only: "&cThe admin menu can only be opened in-game."
  cooldown: "&7Please wait &e&l%time%s &7before using RTP again."
  already-counting: "&eYour RTP request is already running. Please wait."
  world-not-found: "&cThat destination world is not loaded or does not exist."
  world-not-allowed: "&cYou cannot start RTP from this world."
  world-disabled: "&cRTP is disabled in this world."
  destination-world-disabled: "&cRTP is disabled in the destination world."
  invalid-area: "&cThe RTP area for this world has invalid coordinates."
  countdown-start: "&7Random teleport starts in &d&l%time%s&7. &eDon't move!"
  countdown-tick: "&7Teleporting in &d&l%time%&7..."
  countdown-cancelled: "&cTeleport cancelled because you moved."
  searching: "&7Searching for a safe location&8..."
  success: "&aTeleport successful! &7Location: &f%x%&8, &f%y%&8, &f%z% &7in &d%world%&7."
  failed: "&cCouldn't find a safe location. Please try again."
  busy: "&eRTP is busy right now. Please try again in a moment."
  timeout: "&cRTP search took too long. Please try again."
  world-enabled: "&aRTP enabled for world &f%world%&a."
  world-disabled-admin: "&cRTP disabled for world &f%world%&c."
  reloaded: "&aConfiguration reloaded successfully."
