# إعدادات النقل العشوائي
config-version: 2
# استخدم /rtp reload لتطبيق التعديلات دون إعادة تشغيل السيرفر.

world: ""
allowed-worlds: []
disabled-worlds: []
world-settings: {}
world-areas: {}
minimum-radius: 1000
maximum-radius: 50000
countdown-seconds: 0
cooldown-seconds: 30
maximum-attempts: 200
maximum-active-searches: 25
search-timeout-seconds: 20
load-chunks: true
avoid-water: true

# إعدادات قائمة اختيار العالم
# الأحجام المدعومة هي 27 أو 54 خانة، وتُستخدم الصفحات تلقائيًا عند الحاجة.
menu:
  title: "&8&lRANDOM TELEPORT"
  size: 27
  filler: true
  # نمط أيقونات العوالم: DEFAULT أو CLASSIC أو MINIMAL.
  icon-style: DEFAULT
  close-slot: 22
  world-slots:
    world: 11
    world_nether: 13
    world_the_end: 15

# إعدادات مخصصة لكل عالم؛ أي قيمة غير محددة تستخدم الإعداد العام.
# استخدم enabled: false لإخفاء العالم من القائمة ومنع النقل إليه.
# تحدد minimum-y و maximum-y نطاق الارتفاع المسموح به.
# world-settings:
#   world:
#     enabled: true
#     minimum-radius: 1000
#     maximum-radius: 50000
#     minimum-y: -64
#     maximum-y: 320
#     countdown-seconds: 0
#     cooldown-seconds: 30
#     maximum-attempts: 200
#     search-timeout-seconds: 20
#
# نطاق اختياري لكل عالم، وتُحدد الإحداثيات بوحدات البلوكات على محوري X و Z.
# world-areas:
#   world:
#     min-x: -3000
#     max-x: 3000
#     min-z: -3000
#     max-z: 3000

# رسائل اللاعب؛ تدعم رموز الألوان باستخدام & والمتغيرات الموضحة في الرسائل.
messages:
  prefix: "&8[&5VoidFlame &dRTP&8] &r"
  no-permission: "&cError: &7You do not have permission to use this command."
  usage: "&7Usage: &f/rtp &8[&fworld&8 | &fgui&8 | &fworlds&8 | &freload&8]"
  players-only: "&cError: &7This command can only be used by a player."
  admin-gui-players-only: "&cError: &7The administration menu can only be opened in-game."
  cooldown: "&eCooldown: &7You can use RTP again in &f%time%s&7."
  already-counting: "&eNotice: &7Your teleport request is already in progress."
  world-not-found: "&cError: &7The selected world is unavailable or has not been loaded."
  world-not-allowed: "&cError: &7RTP cannot be started from your current world."
  world-disabled: "&cUnavailable: &7RTP is disabled in your current world."
  destination-world-disabled: "&cUnavailable: &7RTP is disabled in the selected destination world."
  invalid-area: "&cConfiguration Error: &7The RTP area for this world is invalid. Please contact an administrator."
  countdown-start: "&7Teleporting in &d%time%s&7. &eRemain still to continue."
  countdown-tick: "&7Teleporting in &d%time%&7..."
  countdown-cancelled: "&cCancelled: &7Teleportation was cancelled because you moved."
  searching: "&7Finding a safe destination..."
  success: "&aSuccess: &7Teleported to &f%x%, %y%, %z% &7in &d%world%&7."
  failed: "&cFailed: &7No safe destination was found. Please try again."
  busy: "&eNotice: &7RTP is currently busy. Please try again shortly."
  timeout: "&cTimeout: &7The search took too long. Please try again."
  world-enabled: "&aUpdated: &7RTP has been enabled for world &f%world%&7."
  world-disabled-admin: "&eUpdated: &7RTP has been disabled for world &f%world%&7."
  reloaded: "&aSuccess: &7Configuration reloaded successfully."
