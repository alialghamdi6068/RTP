# Leave empty to use the player's current world.
world: ""

# If empty, RTP can be used in any source world not listed in disabled-worlds.
allowed-worlds: []

# Worlds where players cannot use RTP and which cannot be selected as destinations.
disabled-worlds: []

# Optional rectangular RTP bounds per destination world (block X/Z coordinates).
# When a world is listed here, its rectangle replaces the radius settings.
# Example:
# world-areas:
#   world:
#     min-x: -3000
#     max-x: 3000
#     min-z: -2000
#     max-z: 2000
world-areas: {}

# Fallback for worlds without custom world-areas; measured from world spawn.
minimum-radius: 100
maximum-radius: 5000

# Maximum safe-location candidates checked per request.
maximum-attempts: 20

# Disabled by default to avoid chunk generation lag. Enable only if desired.
load-chunks: false
avoid-water: true

# Countdown before teleport. Moving to another block cancels it.
countdown-seconds: 5

# Cooldown per player, measured from the start of the countdown.
cooldown-seconds: 30

messages:
  no-permission: "&cYou don't have permission to use this command."
  cooldown: "&cYou must wait &e%time% seconds &cbefore using RTP again."
  already-counting: "&eRTP is already counting down. Don't move!"
  countdown-start: "&eRTP starts in &6%time% seconds&e. Don't move!"
  countdown-tick: "&eTeleporting in &6%time%&e..."
  countdown-cancelled: "&cRTP cancelled because you moved."
  searching: "&7Finding a safe random location..."
  success: "&aTeleported to &e%x%, %y%, %z% &ain world &e%world%&a."
  failed: "&cCouldn't find a safe location. Please try again."
  invalid-area: "&cThe configured RTP area has invalid min/max coordinates."
  world-not-found: "&cThe configured RTP world could not be found."
  world-not-allowed: "&cRTP is disabled in your current world."
  world-disabled: "&cRTP is disabled in your current world."
  destination-world-disabled: "&cThe configured destination world has RTP disabled."
  world-enabled: "&aEnabled RTP in &e%world%&a."
  world-disabled-admin: "&cDisabled RTP in &e%world%&c."
  reloaded: "&aRTP configuration reloaded."