# ============================================================
#                         RTP CONFIG
# ============================================================
# Random teleport settings for Paper.
# After editing this file, run: /rtp reload
#
# TIP: Values below are safe defaults. Customize only what you need.
# ============================================================


# ------------------------------------------------------------
# 1. DESTINATION WORLD
# ------------------------------------------------------------
# "" = use the world the player is currently standing in.
# Example: world: "world"
world: ""


# ------------------------------------------------------------
# 2. WORLD ACCESS
# ------------------------------------------------------------
# Worlds players are allowed to START RTP from.
# [] = allow all source worlds except those in disabled-worlds.
# Example: allowed-worlds: ["world", "world_nether"]
allowed-worlds: []

# Worlds where RTP is disabled entirely. These worlds cannot be
# used as a source world or as the configured destination world.
# Example: disabled-worlds: ["world_the_end"]
disabled-worlds: []


# ------------------------------------------------------------
# 3. CUSTOM RTP AREAS (X / Z COORDINATES)
# ------------------------------------------------------------
# Set a separate rectangular area for each world.
# Coordinates are block coordinates; Y is chosen automatically.
#
# A custom area overrides minimum-radius / maximum-radius for that world.
# Leave as {} to use the radius settings instead.
#
# EXAMPLE:
# world-areas:
#   world:
#     min-x: -3000
#     max-x: 3000
#     min-z: -2000
#     max-z: 2000
#   world_nether:
#     min-x: -1000
#     max-x: 1000
#     min-z: -1000
#     max-z: 1000
#
# IMPORTANT: min-x must not be greater than max-x.
#            min-z must not be greater than max-z.
world-areas: {}


# ------------------------------------------------------------
# 4. DEFAULT RTP RANGE
# ------------------------------------------------------------
# Used only for worlds without a custom entry in world-areas.
# Distance is measured from that world's spawn point.
minimum-radius: 100
maximum-radius: 5000


# ------------------------------------------------------------
# 5. TELEPORT COUNTDOWN & COOLDOWN
# ------------------------------------------------------------
# Seconds the player must remain still before teleporting.
# Moving to another block cancels the countdown.
countdown-seconds: 5

# Minimum time between RTP requests for each player.
# The cooldown starts when the countdown begins.
cooldown-seconds: 30


# ------------------------------------------------------------
# 6. PERFORMANCE & SAFE LOCATION CHECKS
# ------------------------------------------------------------
# Number of candidate locations checked per request.
# Higher values may improve success rates but do more work.
maximum-attempts: 20

# false = skip unloaded chunks to help prevent lag.
# true  = allow loading/generating chunks; this may cause lag.
load-chunks: false

# true = avoid water and common unsafe blocks.
avoid-water: true


# ------------------------------------------------------------
# 7. PLAYER MESSAGES
# ------------------------------------------------------------
# Use & color codes. Keep placeholders exactly as written:
# %time% %x% %y% %z% %world%
messages:
  no-permission: "&cYou don't have permission to use this command."
  cooldown: "&cWait &e%time%s &cbefore using RTP again."
  already-counting: "&eRTP is already counting down. Stay still!"
  countdown-start: "&eRTP begins in &6%time% seconds&e. Don't move!"
  countdown-tick: "&eTeleporting in &6%time%&e..."
  countdown-cancelled: "&cRTP cancelled because you moved."
  searching: "&7Finding a safe random location..."
  success: "&aTeleported to &e%x%, %y%, %z% &ain &e%world%&a."
  failed: "&cCouldn't find a safe location. Please try again."
  invalid-area: "&cThis world's RTP area has invalid min/max coordinates."
  world-not-found: "&cThe configured RTP destination world could not be found."
  world-not-allowed: "&cRTP cannot be started from this world."
  world-disabled: "&cRTP is disabled in this world."
  destination-world-disabled: "&cRTP is disabled in the destination world."
  world-enabled: "&aEnabled RTP in &e%world%&a."
  world-disabled-admin: "&cDisabled RTP in &e%world%&c."
  reloaded: "&aRTP configuration reloaded."
