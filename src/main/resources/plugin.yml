name: RTP
version: 1.0.0
main: net.voidflame.rtp.RTP
api-version: '26.2'
description: Configurable random teleport plugin for Paper 26.2.
author: VoidFlame
commands:
  rtp:
    description: Teleport randomly or manage RTP worlds.
    usage: /rtp [gui|reload]
    aliases: [randomtp]
permissions:
  rtp.use:
    description: Allows using /rtp.
    default: true
  rtp.admin:
    description: Allows managing RTP worlds and reloading configuration.
    default: op
  rtp.bypasscooldown:
    description: Bypasses the RTP cooldown.
    default: op